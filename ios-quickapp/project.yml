name: MobileCodexQuick
options:
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.mobilecodex.quick
    SWIFT_VERSION: 5.9
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
packages: {}
targets:
  MobileCodexQuick:
    type: application
    platform: iOS
    sources:
      - path: App
    settings:
      base:
        INFOPLIST_KEY_CFBundleDisplayName: "移动Codex"
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.productivity"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleDefault
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoads: true
        INFOPLIST_KEY_LSApplicationQueriesSchemes:
          - tailscale
          - ts-vpn
          - prefs
    info:
      path: App/AppEntry/Info.plist
      properties:
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleShortVersionString: 0.1.0
        CFBundleVersion: 1
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    scheme:
      testTargets: []
